name: Android build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for the APK release
        required: true
        default: v2.4.0-450nk

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate English and Spanish UI resources
        run: python3 scripts/validate_translations.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK for branches and pull requests
        if: github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        run: ./gradlew assembleDebug

      - name: Restore permanent release key
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          ANDROID_SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_BUNDLE_BASE64"
          mkdir -p "$RUNNER_TEMP/opencfmoto-signing"
          printf '%s' "$ANDROID_SIGNING_BUNDLE_BASE64" | base64 --decode > "$RUNNER_TEMP/opencfmoto-signing.tar.gz"
          tar -xzf "$RUNNER_TEMP/opencfmoto-signing.tar.gz" -C "$RUNNER_TEMP/opencfmoto-signing"
          chmod 600 "$RUNNER_TEMP/opencfmoto-signing/"*

      - name: Build permanently signed release APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          SIGNING_PASSWORD="$(tr -d '\r\n' < "$RUNNER_TEMP/opencfmoto-signing/OpenCfMoto-450NK-signing-password.txt")"
          SIGNING_STORE_FILE="$RUNNER_TEMP/opencfmoto-signing/OpenCfMoto-450NK-permanent-signing.p12" \
          SIGNING_STORE_PASSWORD="$SIGNING_PASSWORD" \
          SIGNING_KEY_ALIAS="opencfmoto450nk" \
          SIGNING_KEY_PASSWORD="$SIGNING_PASSWORD" \
            ./gradlew assembleRelease

      - name: Name debug APK
        if: github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        run: cp app/build/outputs/apk/debug/app-debug.apk OpenCfMoto-450NK-debug.apk

      - name: Name signed release APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: cp app/build/outputs/apk/release/app-release.apk OpenCfMoto-450NK.apk

      - name: Validate debug APK identity
        if: github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$("$AAPT" dump badging OpenCfMoto-450NK-debug.apk | head -1)"
          echo "$BADGING"
          grep -Fq "package: name='com.andpower.opencfmoto450nk' versionCode='77' versionName='2.4.0-450nk'" <<<"$BADGING"

      - name: Validate signed release APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          BADGING="$("$AAPT" dump badging OpenCfMoto-450NK.apk | head -1)"
          VERIFY="$("$APKSIGNER" verify --verbose --print-certs OpenCfMoto-450NK.apk)"
          echo "$BADGING"
          echo "$VERIFY"
          grep -Fq "package: name='com.andpower.opencfmoto450nk' versionCode='77' versionName='2.4.0-450nk'" <<<"$BADGING"
          grep -Fqi "68d6c68651915fc7c598b53a7e0daecfa4f12075711960c8b004e07afdb05a84" <<<"${VERIFY//:/}"

      - name: Upload debug APK artifact
        if: github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: OpenCfMoto-450NK-debug
          path: OpenCfMoto-450NK-debug.apk
          if-no-files-found: error

      - name: Upload signed APK artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: OpenCfMoto-450NK
          path: OpenCfMoto-450NK.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          sha256sum OpenCfMoto-450NK.apk > OpenCfMoto-450NK.apk.sha256
          gh release create "$RELEASE_TAG" OpenCfMoto-450NK.apk OpenCfMoto-450NK.apk.sha256 \
            --target "$GITHUB_SHA" \
            --latest \
            --title "OpenCfMoto 450NK 2.4.0 — Android Auto 17.4+" \
            --notes "Android Auto 17.4+ por puerto 5277, base upstream 2.0.18-pre, perfil 450NK, Apps seguras en parado y firma permanente."
