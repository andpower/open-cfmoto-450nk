name: Android build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for the APK release
        required: true
        default: v2.3.0-450nk

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate English and Spanish UI resources
        run: python3 scripts/validate_translations.py

      - name: Run unit tests and build APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Name 450NK APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OpenCfMoto-450NK.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCfMoto-450NK
          path: OpenCfMoto-450NK.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v2.3.0-450nk' }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its APK unchanged."
          else
            gh release create "$RELEASE_TAG" OpenCfMoto-450NK.apk \
              --target "$GITHUB_SHA" \
              --latest \
              --title "OpenCfMoto 450NK 2.3.0 — Español / English" \
              --notes "Actualización 450NK basada en OpenCfMoto 2.0.6.
          
          Incluye mejoras de inicio y reconexión de Android Auto, detección Wi-Fi AP/Wi-Fi Direct,
          emparejamiento manual por SSID y contraseña, correcciones de Mapas/GPX, QR MotoFun/Moto Morini,
          iconos y recursos bilingües.
          
          Corrige además la proyección de aplicaciones estacionadas: espera el enlace EasyConn y un cuadro
          H.264 real antes de abrir la aplicación, controla el estado del stream, informa la etapa que falla
          y reintenta una vez si la imagen se detiene.
          
          La edición conserva el identificador com.andpower.opencfmoto450nk, el logo 450NK, español/inglés
          y puede convivir con OpenCfMoto original. Los contenidos DRM o FLAG_SECURE pueden mostrarse negros
          por una restricción de Android."
          fi
