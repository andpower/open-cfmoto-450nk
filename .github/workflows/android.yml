name: Android build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for the APK release
        required: true
        default: v2.2.0-450nk

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate English and Spanish UI resources
        run: python3 scripts/validate_translations.py

      - name: Run unit tests and build APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Name 450NK APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OpenCfMoto-450NK.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCfMoto-450NK
          path: OpenCfMoto-450NK.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >
          gh release create "$RELEASE_TAG" OpenCfMoto-450NK.apk
          --target "$GITHUB_SHA"
          --title "OpenCfMoto 450NK 2.2.0 — Español / English"
          --notes "Edición probada en 450NK con interfaz completa en español e inglés.
          El idioma sigue al teléfono automáticamente o se puede elegir en Configuración:
          Automático, Español o English. Incluye el lanzador de aplicaciones estacionadas,
          selector de aplicaciones instaladas, proyección de pantalla completa, bloqueo por
          movimiento y controles multimedia temporales desde el manillar. Usa su propio
          identificador e ícono 450NK, por lo que puede instalarse junto al OpenCfMoto original."
