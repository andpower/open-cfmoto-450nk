name: Android build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for the APK release
        required: true
        default: v2.2.1-450nk

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate English and Spanish UI resources
        run: python3 scripts/validate_translations.py

      - name: Restore permanent release key
        env:
          ANDROID_SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        run: |
          test -n "$ANDROID_SIGNING_BUNDLE_BASE64"
          mkdir -p "$RUNNER_TEMP/opencfmoto-signing"
          printf '%s' "$ANDROID_SIGNING_BUNDLE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/opencfmoto-signing.tar.gz"
          tar -xzf "$RUNNER_TEMP/opencfmoto-signing.tar.gz" \
            -C "$RUNNER_TEMP/opencfmoto-signing"
          chmod 600 "$RUNNER_TEMP/opencfmoto-signing/"*

      - name: Run unit tests and build permanently signed APK
        run: |
          SIGNING_PASSWORD="$(
            tr -d '\r\n' < "$RUNNER_TEMP/opencfmoto-signing/OpenCfMoto-450NK-signing-password.txt"
          )"
          SIGNING_STORE_FILE="$RUNNER_TEMP/opencfmoto-signing/OpenCfMoto-450NK-permanent-signing.p12" \
          SIGNING_STORE_PASSWORD="$SIGNING_PASSWORD" \
          SIGNING_KEY_ALIAS="opencfmoto450nk" \
          SIGNING_KEY_PASSWORD="$SIGNING_PASSWORD" \
            ./gradlew testDebugUnitTest assembleRelease

      - name: Name 450NK APK
        run: cp app/build/outputs/apk/release/app-release.apk OpenCfMoto-450NK.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCfMoto-450NK
          path: OpenCfMoto-450NK.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v2.2.1-450nk' }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its APK unchanged."
          else
            gh release create "$RELEASE_TAG" OpenCfMoto-450NK.apk \
              --target "$GITHUB_SHA" \
              --title "OpenCfMoto 450NK 2.2.1 — Español / English" \
              --notes "Primera versión con firma permanente para permitir actualizaciones directas
          en las versiones siguientes. Como las compilaciones 2.1.1 y 2.2.0 usaban firmas de
          depuración efímeras, es necesario desinstalarlas antes de instalar esta versión una sola vez.
          También mejora el ajuste de textos en botones, selectores, cuadros y pantallas compactas.

          Edición probada en 450NK con interfaz completa en español e inglés.
          El idioma sigue al teléfono automáticamente o se puede elegir en Configuración:
          Automático, Español o English. Incluye el lanzador de aplicaciones estacionadas,
          selector de aplicaciones instaladas, proyección de pantalla completa, bloqueo por
          movimiento y controles multimedia temporales desde el manillar. Usa su propio
          identificador e ícono 450NK, por lo que puede instalarse junto al OpenCfMoto original."
          fi

