name: Authorized 450NK stable upstream integration

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: authorized-450nk-stable-integration
  cancel-in-progress: true

jobs:
  integrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/upstream-2.0.9-450nk-hybrid-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out authorized 450NK branch
        uses: actions/checkout@v4
        with:
          ref: agent/upstream-2.0.9-450nk-hybrid-controls
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge stable OpenCfMoto 2.0.13 and preserve 450NK edition
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_STABLE=26726f102c11eab553f220b61d084f4f123f978c

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/zanderp/open-cfmoto.git
          git fetch --no-tags upstream main
          git fetch --force upstream refs/tags/v2.0.13:refs/tags/upstream-v2.0.13
          UPSTREAM_STABLE="$(git rev-parse 'refs/tags/upstream-v2.0.13^{commit}')"
          test "$UPSTREAM_STABLE" = "$EXPECTED_STABLE"

          if git merge-base --is-ancestor "$UPSTREAM_STABLE" HEAD 2>/dev/null && \
             grep -q 'versionName = "2.4.0-450nk"' app/build.gradle.kts && \
             grep -q 'nk450HybridControls' app/src/main/java/dev/zanderp/opencfmoto/MediaButtonBridge.kt; then
            echo "OpenCfMoto 2.0.13 + 450NK patch already integrated."
          else
            set +e
            git merge --no-edit --no-ff -X ours "$UPSTREAM_STABLE"
            merge_status=$?
            set -e

            if [ "$merge_status" -ne 0 ]; then
              echo "Resolving remaining conflicts in favor of existing 450NK edition files."
              while IFS= read -r file; do
                [ -n "$file" ] || continue
                git checkout --ours -- "$file"
                git add -- "$file"
              done < <(git diff --name-only --diff-filter=U)

              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "Unresolved merge conflicts remain:"
                git diff --name-only --diff-filter=U
                exit 1
              fi
              git commit --no-edit
            fi

            python3 scripts/integrate_upstream_209_450nk.py
            python3 scripts/fix_locale_config_209.py
            python3 scripts/import_upstream_209_resources.py
            python3 scripts/fix_upstream_209_semantic_merge.py
          fi

      - name: Validate 450NK edition invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.andpower.opencfmoto450nk"' app/build.gradle.kts
          grep -q 'versionName = "2.4.0-450nk"' app/build.gradle.kts
          grep -q 'const val REPO = "andpower/open-cfmoto-450nk"' app/src/main/java/dev/zanderp/opencfmoto/UpdateChecker.kt
          grep -q '450NK hybrid — short rocker presses remain real volume' app/src/main/java/dev/zanderp/opencfmoto/MediaButtonBridge.kt
          grep -q 'handleNk450VolumeChange' app/src/main/java/dev/zanderp/opencfmoto/MediaButtonBridge.kt
          grep -q 'dispatchNk450NativeTrack' app/src/main/java/dev/zanderp/opencfmoto/MediaButtonBridge.kt
          grep -q 'Nk450VolumeGestureDetector(doubleTapWindowMs =' app/src/main/java/dev/zanderp/opencfmoto/MediaButtonBridge.kt
          test -f app/src/main/java/dev/zanderp/opencfmoto/AppMirrorSession.kt
          test -f app/src/main/java/dev/zanderp/opencfmoto/AppsActivity.kt
          test -f app/src/main/java/dev/zanderp/opencfmoto/ProjectionService.kt
          test -f app/src/main/res/layout/activity_apps.xml
          grep -q '5277' app/src/main/java/dev/zanderp/opencfmoto/aa/AaReceiver.kt
          grep -q 'winningTransport' app/src/main/java/dev/zanderp/opencfmoto/BikeMemory.kt
          grep -q 'v2.4.0-450nk' .github/workflows/android.yml
          ! grep -q 'generateLocaleConfig = true' app/build.gradle.kts

      - name: Validate English and Spanish UI resources
        run: python3 scripts/validate_translations.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Commit and push validated integration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes left to commit."
            exit 0
          fi
          git commit -m "OpenCfMoto 450NK 2.4.0: stable upstream 2.0.13 and fixed NK controls"
          git push origin HEAD:agent/upstream-2.0.9-450nk-hybrid-controls
