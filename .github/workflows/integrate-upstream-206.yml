name: Integrate upstream 2.0.6 and fix Apps

on:
  push:
    branches:
      - agent/upstream-2.0.6-app-projection-fix
    paths:
      - .github/workflows/integrate-upstream-206.yml
      - scripts/integrate_upstream_206.py

permissions:
  contents: write

concurrency:
  group: integrate-upstream-206-450nk
  cancel-in-progress: false

jobs:
  integrate-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out authorized branch
        uses: actions/checkout@v4
        with:
          ref: agent/upstream-2.0.6-app-projection-fix
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge OpenCfMoto 2.0.6
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/zanderp/open-cfmoto.git
          git fetch --no-tags upstream main

          set +e
          git merge --no-edit --no-ff -X ours upstream/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            echo "Resolving remaining add/add or binary conflicts in favor of the existing 450NK edition."
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              git checkout --ours -- "$file"
              git add -- "$file"
            done < <(git diff --name-only --diff-filter=U)

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved merge conflicts remain:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi

      - name: Apply 450NK identity and verified Apps projection fix
        run: python3 scripts/integrate_upstream_206.py

      - name: Validate translations
        run: |
          if [ -f scripts/validate_translations.py ]; then
            python3 scripts/validate_translations.py
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No post-merge changes to commit."
          else
            git commit -m "450NK 2.3.0: import upstream 2.0.6 and fix app projection"
          fi
          git push origin HEAD:agent/upstream-2.0.6-app-projection-fix
